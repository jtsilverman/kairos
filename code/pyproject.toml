[project]
name = "kairos"
version = "0.1.0"
description = "Multi-agent equity research pipeline: screen the US universe, then build and stress-test an evidence-cited thesis per candidate."
requires-python = ">=3.12"
dependencies = [
    "polygon-api-client>=1.16.3",
    "yfinance>=0.2.50",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
]

[build-system]
requires = ["setuptools>=75.0"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
